name: release
on:
  push:
    branches: [main]

# NOTE: this workflow trusts that `main` only receives commits that already
# passed ci.yml (via required-status-checks branch protection on GitHub —
# configure that in repo Settings → Branches; cannot be set from a workflow
# file). It does not re-run tests itself.

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write   # to push the version-bump commit, changelog, and tag
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          # PAT, not the default GITHUB_TOKEN: main's branch ruleset requires
          # all 6 ci.yml status checks and only bypasses RepositoryRole:Admin.
          # The actual `git push` of the version-bump commit happens via the
          # credentials persisted HERE (by actions/checkout), regardless of
          # what token the semantic-release action below is given — the bot
          # identity behind GITHUB_TOKEN isn't covered by the bypass and gets
          # GH013-rejected. See docs/release-setup.md Step 4.
          token: ${{ secrets.RELEASE_TOKEN }}
      # This ran as python-semantic-release/python-semantic-release@v10 until
      # 2026-08-26, and the reason it no longer does is worth keeping: the
      # action's image pinned psr EXACTLY (src/gh_action/requirements.txt is
      # one line, `python-semantic-release == 10.6.1`) and left GitPython
      # unpinned — resolved by pip at IMAGE BUILD time, with `--pre`, on a
      # floating `python:3.14-slim-trixie` base.
      #
      # So no action ref could have constrained it. Pinning by tag or by SHA
      # freezes the Dockerfile, and the Dockerfile is precisely what says
      # "resolve fresh". A rebuilt image picked up a GitPython without
      # `Actor.name_email_regex`, which psr's own config resolution calls
      # unconditionally (semantic_release/cli/config.py:732), so the run died
      # at "Loading configuration from pyproject.toml" before parsing a single
      # commit. Neither project had released anything in the window — the
      # image only had to be rebuilt.
      #
      # Running psr from THIS repo's environment puts that dependency in
      # uv.lock where it is visible, reviewable and bisectable. Both versions
      # were already locked here before this change: psr 10.5.3, GitPython
      # 3.1.50 — and 3.1.50 HAS the attribute, verified by import.
      #
      # The action ran exactly one command (`semantic-release version`, no
      # flags, since this workflow passed only github_token), so this is the
      # same invocation without the container.
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - name: Python Semantic Release
        id: release
        env:
          # psr consumes GH_TOKEN for the GitHub Release API. The `git push`
          # of the version-bump commit still travels on the credentials
          # actions/checkout persisted above — the same split the comment on
          # that step describes, unchanged by this swap.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # `released` and `tag` reach $GITHUB_OUTPUT from psr ITSELF, not from
        # the action wrapper (semantic_release/cli/github_actions_output.py) —
        # the wrapper never wrote them. So `publish` (gated on released) and
        # `changelog-check` (which checks out outputs.tag) keep working.
        run: uv run semantic-release -v version

  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Requires a "pypi" environment configured in repo Settings → Environments,
    # with a Trusted Publisher registered on pypi.org for this repo + workflow
    # (org/repo, workflow filename "release.yml", environment "pypi"). Manual,
    # one-time, PyPI-web-console setup — cannot be done from this workflow.
    environment:
      name: pypi
      url: https://pypi.org/project/downbeat/
    permissions:
      contents: read   # needed for actions/checkout — a job-level `permissions:`
      # block zeroes every unlisted scope (repo is private, so checkout without
      # this 404s as "Repository not found" rather than 403 — GitHub hides
      # private-repo existence from tokens that can't read it)
      id-token: write   # OIDC token exchange for Trusted Publishing — no API token stored
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # semantic-release already pushed the version-bump commit here
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish

  # Deliberately a REPORT, not a gate. CHANGELOG.md going unwritten is only
  # observable after semantic-release has already committed, tagged and pushed —
  # and `publish` ships to PyPI from that same commit, which cannot be undone.
  # So this job runs beside `publish` rather than before it: a red X on a
  # release that already happened is useful, a gate that aborts a legitimate
  # release for a condition created by that release is not.
  #
  # Exists because the changelog stopped being written at v0.3.0 and nobody
  # noticed for eleven releases: PSR's update mode skips silently when the
  # insertion flag is missing from the file (no error, exit 0), and `--noop`
  # reports success in exactly that case. Nothing in CI was looking at the
  # artifact itself. This looks at the artifact itself.
  changelog-check:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 2   # need the release commit's parent to diff against
      - name: Assert the release commit wrote CHANGELOG.md
        run: |
          tag='${{ needs.release.outputs.tag }}'
          if git diff --name-only HEAD~1 HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated by the release commit for $tag."
            exit 0
          fi
          echo "::error::Release $tag did not write CHANGELOG.md."
          echo
          echo "Files changed by the release commit:"
          git diff --name-only HEAD~1 HEAD | sed 's/^/  /'
          echo
          echo "Most likely cause: the insertion flag configured as"
          echo "[tool.semantic_release.changelog].insertion_flag is missing from"
          echo "CHANGELOG.md, so python-semantic-release had nowhere to insert and"
          echo "skipped without erroring. Check that the literal marker is still"
          echo "present in the file."
          echo
          echo "The release itself succeeded and is published — this is a report,"
          echo "not a failed release. Fix the changelog and the next release will"
          echo "carry both entries."
          exit 1
